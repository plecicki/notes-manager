spring.application.name=notes-manager

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/Notes%20manager?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:admin}
spring.datasource.password=${MYSQL_NOTES_MANAGER_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect